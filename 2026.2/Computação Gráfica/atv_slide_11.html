<!DOCTYPE html>
<html>
    <head>
        <title>Exercício slide 11</title>
        <link rel="stylesheet" href="styles.css" />
        <style>
            * {
                box-sizing: border-box;
            }

            #header-section .title {
                margin-bottom: 20px;
            }

            #grid {
                display: flex;
                flex-direction: column;
                padding: 10px;
            }

            #questoes {
                display: grid;
                grid-template-columns: 400px 400px;
                column-gap: 30px;
                margin-bottom: 10px;
                font-weight: bold;
            }

            #tela2 {
                padding-left: 30px;
            }

            #canvas {
                display: flex;
                flex-direction: row;
            }
        </style>
    </head>
    <body>
        <div id="header-section">
            <h1 class="title">Exercício slide 11:</h1>
        </div>

        <div id="grid">
            <div id="questoes">
                <div>
                    a)
                </div>
                <div>
                    b)
                </div>
            </div>

            <div id="canvas">
                <canvas id="tela1" width="300" height="300"></canvas>
                <canvas id="tela2" width="300" height="400"></canvas>
            </div>
        </div>
    </body>

    <!-- desenhando no canvas2d -->
    <script>
        // reta tracejada com função dda()
        const canvas1 = document.getElementById("tela1");
        const ctx1 = canvas1.getContext("2d");

        function dda(x1, y1, x2, y2, ctx1) {
        const dx = x2 - x1;
        const dy = y2 - y1;
        let length = Math.abs(dx);
        if (Math.abs(dy) > length) {
            length = Math.abs(dy);
        }
        const xInc = dx / length;
        const yInc = dy / length;
        let x = x1;
        let y = y1;

        for (let i = 0; i <= length; i++) {
            if (i % 8 < 4) {
            ctx1.fillRect(Math.round(x), Math.round(y), 1, 1);
            }
            x += xInc;
            y += yInc;
            }
        }

        dda(10, 20, 300, 20, ctx1);

        // triangulo()
        const canvas2 = document.getElementById("tela2");
        const ctx2 = canvas2.getContext("2d");

        function triangulo(ctx2) {
            dda(150, 0, 300, 300, ctx2);
            dda(300, 300, 0, 300, ctx2);
            dda(0, 300, 150, 0, ctx2);
        }

        triangulo(ctx2);
    </script>
</html>
